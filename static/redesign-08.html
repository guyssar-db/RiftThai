 $('count').textContent=filtered.length.toLocaleString()+' การ์ด';$('grid').innerHTML=filtered.slice(0,limit).map((c,i)=>'<button class="card" data-i="'+i+'" aria-label="ดู '+esc(c.fullName||c.name)+'"><span class="visual"><span class="spinner" aria-hidden="true"></span><img src="'+esc(src(c))+'" alt="'+esc(c.name)+'" loading="'+(i<8?'eager':'lazy')+'" decoding="async"></span><strong>'+esc(c.fullName||c.name)+'</strong><small><span>'+esc(c.cardType)+' · '+esc((c.domains||[]).join('/'))+'</span><span>'+esc(c.cardCode?.split('-')[0]?.toUpperCase())+'</span></small></button>').join('')||'<p class="empty">ไม่พบการ์ด ลองเปลี่ยนคำค้นหรือล้างตัวกรอง</p>';
 $('more').hidden=filtered.length<=limit;
 $('grid').querySelectorAll('img').forEach(img=>{const done=()=>{img.parentElement.querySelector('.spinner')?.remove();img.classList.add('ready');if(!img.naturalWidth)img.parentElement.classList.add('failed')};img.onload=done;img.onerror=done;if(img.complete)done()});
}
function detail(){ $('detail-image').src=src(selected);$('detail-image').alt=selected.name;$('detail-title').textContent=selected.fullName||selected.name;$('detail-meta').textContent=[selected.cardCode,selected.cardType,selected.rarity,...(selected.domains||[])].filter(Boolean).join(' · ');$('ability').textContent=(language==='th'?selected.abilityEffectiveThai:selected.abilityEffective)||'ไม่มีข้อความความสามารถ';document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===language)))}

$('detail').addEventListener('close',()=>document.body.style.overflow='');$('close').onclick=()=>$('detail').close();$('detail').onclick=e=>{if(e.target===$('detail')&&(()=>{const r=$('detail').getBoundingClientRect();return e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom})())$('detail').close()};

const referenceContent={"keywords":"<h2>คีย์เวิร์ด</h2><article><h3>Recycle</h3><p>การนำการ์ดรูนหรือการ์ดจากมือ ตามที่มาของการ์ดนั้น ส่งกลับเข้าใต้กอง</p></article><article><h3>Legion</h3><p>ความสามารถจะทำงานก็ต่อเมื่อคุณได้ทำการ 'เล่นการ์ดใบอื่น' ไปแล้วอย่างน้อย 1 ใบในเทิร์นนี้ (คอมโบต่อเนื่อง)</p></article><article><h3>Hidden</h3><p>จ่ายค่าร่าย 1 Power (โดยการ Recycle รูน) เพื่อนำการ์ดไปวางคว่ำหน้าซ่อนไว้ใน Battlefield และสามารถเปิดหงายใช้งาน (Trigger) ได้ฟรีในภายหลัง</p></article><article><h3>Accelerate</h3><p>ทางเลือกในการจ่ายค่าร่ายเพิ่มเติม (มักจะเป็น 1 Energy + Recycle 1 รูน) เพื่อให้ยูนิตลงสนามมาในสภาพ Ready (ตั้งตรง) พร้อมใช้งานทันทีโดยไม่ต้องรอเทิร์นถัดไป</p></article><article><h3>Action</h3><p>ประเภทของการ์ดหรือสกิลที่สามารถเล่นได้ในเฟสหลัก (Action Phase) ของเทิร์นเจ้าของการ์ด หรือเล่นในช่วงเปิดศึก (Showdown) ได้</p></article><article><h3>Reaction</h3><p>ประเภทของการ์ดความเร็วสูง (Instant) ที่สามารถร่ายสวนกลับหรือขัดจังหวะคู่แข่งได้ตลอดเวลา รวมถึงในเทิร์นของคู่แข่งและช่วงการต่อสู้</p></article><article><h3>Ambush</h3><p>ยูนิตที่มีคีย์เวิร์ดนี้สามารถร่ายลงสนามด้วยความเร็วระดับ Reaction (ร่ายแทรกได้) แต่ต้องลงใน Battlefield ที่เรามีทหารคุมอยู่แล้วเท่านั้น</p></article><article><h3>Quick-Draw</h3><p>คล้ายกับ Ambush แต่ใช้สำหรับ 'การ์ดอุปกรณ์ (Gear)' หรือเวทมนตร์ ให้สามารถร่ายติดตั้งหรือใช้งานด้วยความเร็ว Reaction ได้</p></article><article><h3>Deploy</h3><p>เล่นการ์ดใบนี้ได้เฉพาะที่ Battlefield เมื่อคู่แข่ง Hold ที่นี่, ทำลายการ์ดใบนี้</p></article><article><h3>Show Off</h3><p>ขณะที่คุณเล่นการ์ดใบนี้, คุณสามารถเปิดเผยยูนิตจากมือหรือเลือกยูนิตฝ่ายเรา 1 ใบ</p></article><article><h3>Hunt</h3><p>กลไกพิเศษที่จะได้รับค่า XP สำหรับการ Level Up เมื่อการ์ดใบนี้ Conquer หรือ Hold</p></article><article><h3>Deflect</h3><p>เกราะป้องกันเวทย์/สกิล: หากคู่แข่งต้องการเลือกการ์ดใบนี้ด้วยเวทมนตร์หรือความสามารถ คู่แข่งต้องจ่ายค่าร่าย Power เพิ่ม (Tax) มิฉะนั้นจะเลือกไม่ได้</p></article><article><h3>Deathknell</h3><p>ความสามารถที่จะทำงานเมื่อยูนิตนี้ตายและถูกส่งลงสุสาน (Trash)</p></article><article><h3>Temporary</h3><p>ยูนิตหรือการ์ดนี้จะถูกทำลายเมื่อจบเทิร์น หรือช่วงเริ่มต้น Beginning Phase ของผู้ควบคุม</p></article><article><h3>Level</h3><p>ระบบสะสมค่าประสบการณ์ (XP) ของแชมเปี้ยนในการ์ดเซ็ต Unleashed เมื่อเงื่อนไข XP ครบ จะอัปเกรดร่างและได้รับความสามารถใหม่</p></article><article><h3>Ganking</h3><p>ความสามารถพิเศษที่ทำให้ยูนิตเคลื่อนที่จาก Battlefield หนึ่งไปยังอีก Battlefield หนึ่งได้โดยตรง โดยไม่ต้องกลับ Base ก่อน</p></article><article><h3>Empowered</h3><p>สถานะปลุกพลังของการ์ดใบนี้ ซึ่งจะช่วยมอบความสามารถพิเศษเพิ่มเติมเมื่อปลุกพลังแล้ว</p></article><article><h3>Mighty</h3><p>สถานะที่บ่งบอกว่ายูนิตนั้นมีค่าพลังโจมตี (Might) ตั้งแต่มูลค่า 5 แต้มขึ้นไป</p></article><article><h3>Vision</h3><p>เมื่อยูนิตนี้ลงสนาม ให้ทำการ Predict 1 (ดูการ์ดใบบนสุดของกอง 1 ใบ เลือกได้ว่าจะ Recycle ส่งกลับเข้าใต้กอง หรือวางกลับไว้ที่เดิม)</p></article><article><h3>Weaponmaster</h3><p>ผู้ชำนาญอาวุธ: เมื่อคุณเล่นการ์ดใบนี้ สามารถ Equip การ์ดอุปกรณ์ 1 ใบของคุณมาสวมใส่ให้การ์ดใบนี้โดยจ่ายค่าร่ายน้อยลง [A] แม้จะสวมใส่อยู่กับการ์ดอื่นแล้วก็ตาม</p></article><article><h3>Equip</h3><p>การติดตั้งการ์ดประเภท Gear (อาวุธ/อุปกรณ์) เข้ากับยูนิตเพื่อเพิ่มค่าพลังหรือความสามารถ</p></article><article><h3>Add</h3><p>คำสั่งเพิ่มทรัพยากร (เช่น '[Add] [A]') หมายถึงการได้รับทรัพยากรนั้นทันทีโดยที่คู่แข่งไม่สามารถ Reaction สวนกลับได้</p></article><article><h3>Empower</h3><p>การจ่ายค่าพลังตามจำนวนที่ระบุเพื่อปลุกพลังการ์ด (สามารถทำได้เฉพาะเมื่อการ์ดใบนี้ยังไม่เข้าสู่สถานะ Empowered เท่านั้น)</p></article><article><h3>Burn</h3><p>คำสั่งเผากองการ์ด โดยการนำการ์ดใบบนสุดของ Main Deck ตามจำนวนที่ระบุ (เช่น Burn 1) ส่งลงสุสาน (Trash)</p></article><article><h3>Flow</h3><p>ความสามารถที่ยอมให้คุณจ่ายค่าร่าย Flow เพื่อร่ายการ์ดใบนี้จากในสุสาน (Trash) จากนั้นให้ Banish การ์ดใบนี้ออกนอกเกม</p></article><article><h3>Banish</h3><p>การนำการ์ดออกจากเกม ไม่ถือว่าอยู่ใน Trash และโดยปกติไม่สามารถนำกลับมาได้ เว้นแต่จะมีการ์ดที่ระบุไว้โดยเฉพาะ</p></article><article><h3>Stun</h3><p>ยูนิตที่ถูก Stun จะไม่สามารถสร้างความเสียหายจากการต่อสู้ (Combat Damage) ได้ในเทิร์นนี้</p></article><article><h3>Buff</h3><p>การมอบโทเคน/สถานะ Buff ให้กับการ์ดเพื่อเพิ่มพลัง หรือสละ Buff เพื่อเปิดใช้งานความสามารถพิเศษ</p></article><article><h3>Predict</h3><p>ดูการ์ดจากใบบนสุดของ Main Deck ตามจำนวนที่กำหนด เลือก Recycle ใบที่ไม่ต้องการโดยส่งกลับเข้าใต้กอง และเรียงใบที่เหลือกลับไว้บนกอง</p></article><article><h3>Backline</h3><p>ยูนิตนี้จะได้รับความเสียหายจากการต่อสู้ (Combat Damage) เป็นลำดับสุดท้าย</p></article><article><h3>Tank</h3><p>ยูนิตนี้ต้องรับความเสียหายจากการต่อสู้ (Combat Damage) เป็นลำดับแรกสุดในเลนนั้นเสมอ</p></article><article><h3>Shield</h3><p>ยูนิตจะได้รับค่าพลังโจมตีเพิ่มขึ้น (+X Might) ขณะที่เป็นป้องกัน (Defender) หรือเริ่มเปิด Showdown</p></article><article><h3>Disarm</h3><p>เมื่อยูนิตนี้โจมตี จะลดค่า Might (S) ของยูนิตศัตรูตามที่ระบุในความสามารถ</p></article><article><h3>Assault</h3><p>ยูนิตจะได้รับค่าพลังโจมตีเพิ่มขึ้น (+X Might) ขณะที่เป็นฝ่ายโจมตี (Attack) หรือเริ่มเปิด Showdown</p></article>","phases":"<h2>ลำดับเทิร์น</h2><article><h3>1. เฟสเตรียมพร้อม</h3><p>AWAKEN PHASE</p><p>ถอดสถานะ มึนงง (Stun)</p><p>เปลี่ยนการ์ดที่ เหนื่อย (Exhausted) ทั้งหมด (Units, Runes, Champions, Gear) กลับมาเป็น พร้อม (Ready)</p></article><article><h3>2. เฟสเริ่มต้น</h3><p>BEGINNING PHASE</p><p>ตรวจสอบแต้ม Hold: ได้รับ 1 แต้มต่อ 1 Battlefield ที่เราคุมได้</p><p>ความสามารถ &quot;At the start of your turn...&quot; ทั้งหมดทำงาน</p></article><article><h3>3. เฟสรูน</h3><p>CHANNEL PHASE</p><p>นำ รูน 2 ใบ จาก Rune Deck เข้าสู่สนาม (ในสภาพหงายหน้า)</p><p>พิเศษ: หากคุณเป็นผู้เล่นคนที่สองในเทิร์นแรก ให้ Channel รูนเพิ่มเป็น 3 ใบ</p></article><article><h3>4. เฟสจั่วการ์ด</h3><p>DRAW PHASE</p><p>จั่วการ์ด 1 ใบจาก Main Deck ขึ้นมือ</p></article><article><h3>5. เฟสหลัก (ทำแอ็คชัน)</h3><p>ACTION PHASE</p><p>Play Card: จ่าย Energy + รูน ลงยูนิต/ร่ายเวท</p><p>Set Hidden: จ่าย 1 Power Rune วางการ์ดคว่ำหน้า</p><p>Use Ability: สั่ง Exhaust ยูนิตเพื่อใช้ความสามารถ</p><p>Move Unit: สั่ง Exhaust ยูนิตเพื่อเดินหน้าในเลน</p></article><article><h3>6. เฟสจบเทิร์น</h3><p>END OF TURN</p><p>ผลลัพธ์ &quot;this turn&quot; ทั้งหมดหมดผลลง</p><p>Global Heal: ฟื้นฟูพลังชีวิตยูนิตทุกตัวบนกระดานจนเต็ม</p><p>ประกาศส่งเทิร์นให้ผู้เล่นฝั่งตรงข้าม</p></article>"};
const reference=document.createElement('section');reference.hidden=true;reference.className='reference';document.querySelector('.content').prepend(reference);
document.querySelectorAll('.catalog-tabs a').forEach((a,index)=>{a.href=['#cards','#keywords','#phases'][index];a.onclick=e=>{e.preventDefault();document.querySelectorAll('.catalog-tabs a').forEach(b=>{b.classList.toggle('active',b===a);b.removeAttribute('aria-current')});a.setAttribute('aria-current','page');for(const el of document.querySelector('.content').children){if(el!==reference&&!el.classList.contains('preview-switch'))el.hidden=index!==0}reference.hidden=index===0;if(index)reference.innerHTML=referenceContent[index===1?'keywords':'phases'];};});
